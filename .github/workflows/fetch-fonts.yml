name: Fetch fonts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and self-host site fonts (no third-party requests at runtime)
        run: python3 .github/fetch_fonts.py
      - name: Commit self-hosted fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts
          if git diff --cached --quiet; then
            echo "no font changes"
          else
            git commit -m "Self-host fonts: fetch woff2 via Actions (privacy: zero third-party requests)"
            git push
          fi
