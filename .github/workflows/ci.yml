name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate static site
        run: |
          python - <<'PY'
          import pathlib, re, sys
          from html.parser import HTMLParser

          root = pathlib.Path(".")

          VOID = {"area","base","br","col","embed","hr","img","input","link","meta","source","track","wbr"}

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack:
                      self.errors.append(f"unexpected closing </{tag}>")
                  elif self.stack[-1] == tag:
                      self.stack.pop()
                  else:
                      self.errors.append(f"mismatched </{tag}>, open stack top: {self.stack[-1] if self.stack else None}")

          html_files = sorted(root.glob("*.html"))
          for page in html_files:
              c = Checker()
              c.feed(page.read_text(encoding="utf-8"))
              c.close()
              if c.stack:
                  c.errors.append(f"unclosed tags: {c.stack}")
              if c.errors:
                  print(f"HTML errors in {page.name}:", c.errors)
                  sys.exit(1)

              refs = set(re.findall(r'(?:src|href)="([^"]+)"', page.read_text(encoding="utf-8")))
              local = [r for r in refs
                       if not r.startswith(("http://", "https://", "#", "mailto:", "tel:", "data:"))
                       and not r.endswith(".html")]
              local += [r for r in refs
                        if r.endswith(".html") and not r.startswith(("http://", "https://"))]
              missing = [r for r in local if not (root / r.split("#")[0]).exists()]
              if missing:
                  print(f"Missing local references in {page.name}:", sorted(missing))
                  sys.exit(1)

          for required in ("index.html", "scan.html", "404.html", "styles.css", "script.js", "scan.js",
                           "robots.txt", "sitemap.xml", ".well-known/security.txt",
                           "assets/favicon-16.png", "assets/favicon-32.png", "assets/favicon-64.png",
                           "assets/apple-touch-icon.png", "assets/og-image.png", "vercel.json"):
              if not (root / required).exists():
                  print(f"Missing required file: {required}")
                  sys.exit(1)

          # every local asset referenced from HTML must exist (incl. assets/)
          for page in html_files:
              text = page.read_text(encoding="utf-8")
              for r in re.findall(r'(?:src|href)="([^"]+)"', text):
                  if r.startswith(("http://", "https://", "#", "mailto:", "tel:", "data:")):
                      continue
                  if not (root / r.split("#")[0]).exists():
                      print(f"Missing local reference in {page.name}: {r}")
                      sys.exit(1)

          print(f"OK ({len(html_files)} pages validated)")
          PY
